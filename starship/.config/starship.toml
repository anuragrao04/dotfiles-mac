# Pretty + fast Starship prompt
# No expensive git dirty/status scan.

add_newline = false
command_timeout = 250
scan_timeout = 10

format = """
$os$username$hostname$directory$git_branch$nodejs$python$golang$rust$kubernetes$cmd_duration$line_break$character"""

[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style) "

[os.symbols]
Macos = "󰀵"

[username]
show_always = false
style_user = "bold green"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold green"
format = "[@$hostname]($style) "

[directory]
style = "bold cyan"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
disabled = true

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = []

[python]
symbol = " "
style = "bold yellow"
format = 'via [$symbol$pyenv_prefix($version)(\($virtualenv\))]($style) '

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version)]($style) "

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version)]($style) "

[kubernetes]
disabled = true
symbol = "󱃾 "
style = "bold blue"
format = "[$symbol$context(/$namespace)]($style) "

[cmd_duration]
min_time = 1500
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# 24-bit color (true color) support
set -g default-terminal "tmux-256color"
# tmux 3.2+ way: declare RGB support via terminal-features
set -as terminal-features ",xterm-kitty:RGB:extkeys"
set -as terminal-features ",xterm-256color:RGB:extkeys"
# Ensure COLORTERM is passed through to programs inside tmux
set -ga update-environment "COLORTERM"
set-environment -g COLORTERM truecolor

# Change prefix to Alt+Space
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# Mouse support
set -g mouse on

# Enable modified keys (e.g. modified Enter)
set -g extended-keys on
set -g extended-keys-format csi-u

# vim navigation
setw -g mode-keys vi

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# Session persistence (resurrect + continuum)
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# Tokyo Night theme
set -g @tokyo-night-tmux_theme storm
set -g @tokyo-night-tmux_transparent 1

# Window navigation
bind -n C-S-h previous-window
bind -n C-S-l next-window

# Project picker (sesh + fzf) — prefix + T
bind-key T display-popup -E -w 60% -h 60% \
  'sesh connect "$(sesh list | fzf \
    --no-sort --ansi --prompt "project> " \
    --header "ctrl-t:tmux  ctrl-z:zoxide  ctrl-d:kill" \
    --bind "ctrl-t:change-prompt(tmux> )+reload(sesh list -t)" \
    --bind "ctrl-z:change-prompt(zoxide> )+reload(sesh list -z)" \
    --bind "ctrl-d:execute(tmux kill-session -t {})+reload(sesh list)")"'

# Split panes in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Resize mode: prefix + r, then use h/j/k/l to resize, Escape or Enter to exit
bind r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize H resize-pane -L 1 \; switch-client -T resize
bind -T resize J resize-pane -D 1 \; switch-client -T resize
bind -T resize K resize-pane -U 1 \; switch-client -T resize
bind -T resize L resize-pane -R 1 \; switch-client -T resize
bind -T resize Escape switch-client -T prefix
bind -T resize Enter switch-client -T prefix

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
